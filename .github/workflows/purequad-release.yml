# PureQuad build (fork patch): the employee kits of PureQuad PDF, built by GitHub Actions.
#
#   Actions › "PureQuad kits" › Run workflow    test build; the kits are the run's artifacts
#   git tag v1.2.3 && git push origin v1.2.3     the same, plus a GitHub release with the kits
#
# Produces PureQuad-PDF-<version>-mac.dmg (Apple silicon + Intel) and
# PureQuad-PDF-<version>-windows-x64.msi. Signing is optional: without the secrets below the
# kits are unsigned (macOS then needs right-click › Open the first time; Windows shows
# SmartScreen). Secrets, same names as upstream's packaging scripts:
#   macOS: APPLE_CERTIFICATE (base64 .p12 of a "Developer ID Application" certificate),
#          APPLE_CERTIFICATE_PASSWORD, KEYCHAIN_PASSWORD, and for notarization APPLE_ID,
#          APPLE_PASSWORD (app-specific password), APPLE_TEAM_ID
#   Windows: WINDOWS_CERTIFICATE + WINDOWS_CERTIFICATE_PASSWORD, or the AZURE_* Trusted Signing set
#
# Upstream's release.yml (storytold/craft-common-actions) is not used by the PureQuad build.
name: PureQuad kits

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: purequad-kits-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    runs-on: macos-14
    timeout-minutes: 120
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Signing certificate
        if: env.APPLE_CERTIFICATE != ''
        run: packaging/macos/import-cert.sh
      - name: Build the DMG
        run: |
          export DIST="$PWD/dist"
          packaging/macos/package.sh --arch universal
          v=$(ls dist/pdfcraft-*-macos-universal.dmg | sed -E 's/.*pdfcraft-(.*)-macos-universal.dmg/\1/')
          mkdir -p kits && cp "dist/pdfcraft-$v-macos-universal.dmg" "kits/PureQuad-PDF-$v-mac.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: kit-macos
          path: kits/*

  windows:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
      AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
      AZURE_CERT_PROFILE: ${{ secrets.AZURE_CERT_PROFILE }}
    steps:
      - uses: actions/checkout@v4
      - name: WiX 5
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2
          wix extension add -g WixToolset.Util.wixext/5.0.2
      - name: Build the MSI
        shell: pwsh
        run: |
          $env:DIST = Join-Path $PWD 'dist'
          ./packaging/windows/package.ps1 -Arch x64
          $msi = Get-ChildItem dist/pdfcraft-*-windows-x64.msi | Select-Object -First 1
          $v = $msi.Name -replace '^pdfcraft-(.*)-windows-x64\.msi$', '$1'
          New-Item -ItemType Directory -Force kits | Out-Null
          Copy-Item $msi.FullName "kits/PureQuad-PDF-$v-windows-x64.msi"
      - uses: actions/upload-artifact@v4
        with:
          name: kit-windows
          path: kits/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: kits
          merge-multiple: true
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" kits/* --repo "$GITHUB_REPOSITORY" --title "PureQuad PDF ${GITHUB_REF_NAME#v}" --notes "Kituri de instalare PureQuad PDF pentru Mac și Windows."
