[package]
name = "purequad-cloud"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "PureQuad Cloud for the PureQuad desktop editors: sign-in, open from the cloud, save versions back"
publish = false

# Shared by PureQuad Docs, Sheets, Slides and PDF. The same sources are vendored into each editor
# as `crates/purequad-cloud`; edit them here and run `sync.sh`.

[features]
# Everything that talks to the cloud. The editors' UI crates (which also build for the web)
# depend on this crate with `default-features = false` for `requests` only.
default = ["net"]
net = ["dep:ureq", "dep:serde", "dep:serde_json", "dep:url", "dep:log"]

[dependencies]
ureq = { version = "3", default-features = false, features = ["rustls", "json"], optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
url = { version = "2", optional = true }
log = { version = "0.4", optional = true }

[[example]]
name = "e2e"
required-features = ["net"]

[[example]]
name = "signin_e2e"
required-features = ["net"]

[lints.rust]
unsafe_code = "forbid"
